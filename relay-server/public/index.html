    <style id="expo-reset">

      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #030712;
        background-image: radial-gradient(circle at 50% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 60%), radial-gradient(circle at 50% 90%, rgba(245, 158, 11, 0.05) 0%, transparent 60%);

      }
      /* Disable scroll on body for React Native ScrollView */
      body {
        overflow: hidden;
      }
      /* Root element: native full screen on mobile, elegant centered mobile frame on desktop */
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        max-width: 580px;
        margin: 0 auto;
        background-color: #050b17;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.85);

      .direct-library-btn {
        position: fixed;
        bottom: 18px;
        right: 18px;
        z-index: 9999;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.4);
        padding: 0.5rem 0.9rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.2s ease;
      }
      .direct-library-btn:hover {
        background: #f59e0b;
        color: #050b17;
        transform: translateY(-2px);
      }
      @media (max-width: 768px) {
